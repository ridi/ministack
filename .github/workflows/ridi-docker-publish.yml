name: RIDI Docker Publish

# Builds and pushes RIDI's MiniStack fork image to Docker Hub (ridi/ministack).
# Triggered by pushing a RIDI release tag on the trunk, e.g. `1.3.65-ridi.1`
# (cut a tag after merging upstream + RIDI patches into `main`).
#
# Requires repo secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (ridi org).
on:
  push:
    tags:
      - "*-ridi.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Image version, e.g. 1.3.65-ridi.1"
        required: true

env:
  IMAGE: ridi/ministack

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── Regular (Alpine) image — :{version}, :latest ──
      - name: Build and push (regular)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
            ${{ env.IMAGE }}:latest
          build-args: |
            MINISTACK_VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha,scope=regular
          cache-to: type=gha,mode=max,scope=regular

      # ── Full (Debian/glibc + DuckDB for Athena) image — :{version}-full, :full ──
      - name: Build and push (full)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.full
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}-full
            ${{ env.IMAGE }}:full
          build-args: |
            MINISTACK_VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha,scope=full
          cache-to: type=gha,mode=max,scope=full
